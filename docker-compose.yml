version: '3.8'

services:
  # ============================================================================
  # 1. NEO4J: ГРАФОВАЯ БАЗА ДАННЫХ ДЛЯ GraphRAG
  # ============================================================================
  neo4j:
    image: neo4j:5.23.0-community
    container_name: retail_neo4j_db
    ports:
      - "7474:7474" # HTTP интерфейс (Neo4j Browser в браузере)
      - "7687:7687" # Bolt протокол для подключения Python/LlamaIndex
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-your_secure_password_2026} # Берется из .env
      - NEO4J_PLUGINS=["apoc"] # Плагин для продвинутых алгоритмов над графами
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=1G
      - NEO4J_dbms_memory_pagecache_size=512m
      - NEO4J_ACCEPT_LICENSE_AGREEMENT=yes
    volumes:
      - ./data/neo4j/data:/data
      - ./data/neo4j/logs:/logs
      - ./data/neo4j/import:/import
      - ./data/neo4j/plugins:/plugins
    restart: unless-stopped  # better than always
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-your_secure_password_2026} 'RETURN 1' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # ============================================================================
  # 2. QDRANT: ВЕКТОРНАЯ БД ДЛЯ ГИБРИДНОГО ПОИСКА
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: retail_qdrant_db
    ports:
      - "6333:6333" # REST API интерфейс (Веб-панель мониторинга)
      - "6334:6334" # gRPC интерфейс для быстрого обмена данными с Python
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__LOG_LEVEL=INFO
    volumes:
      - ./data/qdrant_storage:/qdrant/storage
      - ./data/qdrant_storage/snapshots:/qdrant/snapshots
    restart: unless-stopped  # better than always
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s